name: Maven Tests

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: maven-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          java: 17
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest-17-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
    - name: Checkout Code
      uses: actions/checkout@v5
    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        java-version: '${{ matrix.java }}'
        distribution: ${{ matrix.distribution || 'temurin' }}
        cache: maven
    - name: Run Maven tests
      run: mvn clean test "-Dmaven.test.skip=false" --no-transfer-progress
    name: test [${{ matrix.expander_leg }}]
